<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vorzex Yönetim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!--
  VORZEX MOBILE yönetici paneli (tarayıcıdan). Oyunun kendi Unity servislerini kullanır; sunucu yok.
  Giriş: Unity Authentication kullanıcı adı + şifre. Ana hesap (SAHIP) oyundaki Yonetim.Yoneticiler'in ilki;
  ek yöneticileri Yöneticiler sekmesinden kullanıcı adı + şifreyle o ekler (liste: ana hesabın "yon_yoneticiler").
  Veri (Cloud Save, herkese açık; her yönetici kendi kaydına yazar, panel ve oyun hepsini birleştirir):
    oyuncular  "oy_*"   (her oyuncu kendisi yazar, 2 dk'da bir; "oy_son" sorgu dizini)
    yönetici   "yon_yasak"  {"<oyuncuId>": {"b": bitiş unix (0 kalıcı), "n": neden, "z": an, "y": veren, "s": 1 kaldırıldı}}
                            (her oyuncu için en yeni "z" geçerli)
               "yon_ayar"   {"duyuru": {"metin", "z", "bitis"}, "bakim": {"acik", "mesaj"}, "minSurum", "surumMesaj", "z"}
                            (en yeni "z" taşıyan geçerli)
               "yon_kayit"  [{"z", "t"}] işlem geçmişi (son 200)
    ana hesap  "yon_yoneticiler" {"<kimlik>": {"ad", "k": kullanıcı adı, "z"}}
  Oyun bunları 2 dk'da bir okur. Bu dosyada şifre ya da gizli anahtar yoktur.
-->
<style>
:root {
  --bg: #eef2f8; --bg2: #e3e9f3; --panel: rgba(255, 255, 255, .82); --panel-d: #ffffff; --panel2: #f1f4f9; --text: #111827; --soluk: #5b6679;
  --kenar: #d9e0ea; --cizgi: #e8ecf3; --altin: #a76a00; --mavi: #2563eb; --mavi2: #7c3aed; --grafik: #2563eb; --yesil: #15803d;
  --kirmizi: #dc2626; --turuncu: #c2610c; --satir: rgba(241, 244, 249, .55);
  --golge: 0 18px 50px rgba(16, 24, 40, .18); --golge-k: 0 1px 2px rgba(16, 24, 40, .05), 0 6px 20px rgba(16, 24, 40, .06);
  --isilti1: rgba(37, 99, 235, .18); --isilti2: rgba(234, 160, 30, .16); --izgara: rgba(17, 24, 39, .045);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #060a13; --bg2: #0a1120; --panel: rgba(16, 23, 38, .78); --panel-d: #111a2b; --panel2: #18233a; --text: #e8edf6; --soluk: #8d9ab0;
    --kenar: rgba(148, 163, 184, .16); --cizgi: rgba(148, 163, 184, .10); --altin: #f5c451; --mavi: #5b8cff; --mavi2: #a78bfa; --grafik: #5b8cff;
    --yesil: #4ade80; --kirmizi: #f87171; --turuncu: #fb923c; --satir: rgba(255, 255, 255, .02);
    --golge: 0 18px 50px rgba(0, 0, 0, .6); --golge-k: inset 0 1px 0 rgba(255, 255, 255, .04), 0 10px 28px rgba(0, 0, 0, .35);
    --isilti1: rgba(91, 140, 255, .22); --isilti2: rgba(245, 196, 81, .12); --izgara: rgba(255, 255, 255, .035);
  }
}
:root[data-theme="dark"] {
  --bg: #060a13; --bg2: #0a1120; --panel: rgba(16, 23, 38, .78); --panel-d: #111a2b; --panel2: #18233a; --text: #e8edf6; --soluk: #8d9ab0;
  --kenar: rgba(148, 163, 184, .16); --cizgi: rgba(148, 163, 184, .10); --altin: #f5c451; --mavi: #5b8cff; --mavi2: #a78bfa; --grafik: #5b8cff;
  --yesil: #4ade80; --kirmizi: #f87171; --turuncu: #fb923c; --satir: rgba(255, 255, 255, .02);
  --golge: 0 18px 50px rgba(0, 0, 0, .6); --golge-k: inset 0 1px 0 rgba(255, 255, 255, .04), 0 10px 28px rgba(0, 0, 0, .35);
  --isilti1: rgba(91, 140, 255, .22); --isilti2: rgba(245, 196, 81, .12); --izgara: rgba(255, 255, 255, .035);
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; min-height: 100vh; background: transparent; color: var(--text);
  font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
/* Arka plan: yumuşak ışıltılar + ince ızgara (sabit, kaydırınca yerinde kalır). */
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(900px 620px at 8% -8%, var(--isilti1), transparent 62%),
    radial-gradient(820px 600px at 102% 4%, var(--isilti2), transparent 58%),
    radial-gradient(760px 520px at 55% 112%, var(--isilti1), transparent 62%),
    linear-gradient(180deg, var(--bg), var(--bg2)); }
body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: linear-gradient(var(--izgara) 1px, transparent 1px) 0 0 / 44px 44px, linear-gradient(90deg, var(--izgara) 1px, transparent 1px) 0 0 / 44px 44px;
  -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 30%, transparent 85%); mask-image: radial-gradient(ellipse at 50% 0%, #000 30%, transparent 85%); }
.kap { max-width: 1280px; margin: 0 auto; padding: 22px 16px 56px; }
/* Üst çubuk: sabit, buzlu cam. */
.ust-cubuk { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--kenar);
  -webkit-backdrop-filter: blur(16px) saturate(140%); backdrop-filter: blur(16px) saturate(140%); }
.ust-cubuk .kap { padding-top: 12px; padding-bottom: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.marka { display: flex; align-items: center; gap: 12px; }
.marka b { display: block; font-size: 17px; letter-spacing: 2.5px; font-weight: 800; }
.marka span { display: block; font-size: 12px; color: var(--soluk); letter-spacing: .4px; margin-top: -2px; }
.logo { flex: none; filter: drop-shadow(0 4px 12px rgba(224, 123, 18, .35)); }
.kim { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; padding: 5px 12px 5px 5px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--kenar); }
.kim i { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 700; font-size: 12px; color: #fff;
  background: linear-gradient(135deg, var(--mavi), var(--mavi2)); }
h1 { font-size: 21px; margin: 0; }
h2 { font-size: 15px; margin: 0 0 12px; font-weight: 650; letter-spacing: .2px; }
.bos { flex: 1; }
.durum { color: var(--soluk); font-size: 13px; }
.hata { color: var(--kirmizi); }
button, input, select, textarea { font: inherit; color: inherit; }
button { border: 1px solid var(--kenar); background: var(--panel2); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 500;
  transition: border-color .15s, transform .15s, box-shadow .15s, background .15s; }
button:hover { border-color: var(--mavi); }
button:active { transform: translateY(1px); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--mavi); outline-offset: 1px; }
button.ana { background: linear-gradient(135deg, var(--mavi), var(--mavi2)); border-color: transparent; color: #fff; box-shadow: 0 6px 18px rgba(80, 100, 255, .28); }
button.ana:hover { box-shadow: 0 8px 24px rgba(80, 100, 255, .4); }
button.tehlike { color: var(--kirmizi); }
button.tehlike.dolu { background: linear-gradient(135deg, #ef4444, #b91c1c); border-color: transparent; color: #fff; box-shadow: 0 6px 18px rgba(220, 38, 38, .25); }
button:disabled { opacity: .5; cursor: default; }
input, select, textarea { border: 1px solid var(--kenar); background: var(--panel-d); padding: 10px 12px; border-radius: 10px; width: 100%; }
textarea { resize: vertical; min-height: 80px; }
label { display: grid; gap: 6px; font-size: 13px; color: var(--soluk); font-weight: 500; }
.kart { background: var(--panel); border: 1px solid var(--kenar); border-radius: 16px; padding: 18px; box-shadow: var(--golge-k);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.giris { max-width: 420px; margin: 9vh auto 0; display: grid; gap: 12px; padding: 30px 28px; box-shadow: var(--golge); }
.giris .bas { text-align: center; display: grid; justify-items: center; gap: 6px; margin-bottom: 8px; }
.giris .bas h1 { font-size: 22px; font-weight: 750; }
.giris .bas p { margin: 0; color: var(--soluk); font-size: 14px; }
.giris button.ana { padding: 11px 14px; }
.not { color: var(--soluk); font-size: 13px; }
.sekmeler { display: flex; gap: 4px; padding: 4px; margin-bottom: 16px; overflow-x: auto; background: var(--panel); border: 1px solid var(--kenar);
  border-radius: 14px; box-shadow: var(--golge-k); scrollbar-width: none; }
.sekmeler::-webkit-scrollbar { display: none; }
.sekmeler button { border: 0; background: transparent; white-space: nowrap; color: var(--soluk); padding: 8px 14px; }
.sekmeler button:hover { color: var(--text); background: var(--panel2); }
.sekmeler button.secili { background: linear-gradient(135deg, var(--mavi), var(--mavi2)); color: #fff; box-shadow: 0 4px 14px rgba(80, 100, 255, .3); }
.sekmeler .sayac { display: inline-block; min-width: 20px; margin-left: 6px; padding: 0 6px; border-radius: 999px; font-size: 11px; line-height: 18px;
  background: var(--kirmizi); color: #fff; text-align: center; }
.ozet { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 14px; }
.ozet .kart { position: relative; overflow: hidden; }
.ozet .kart::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--mavi), var(--mavi2)); opacity: .85; }
.ozet .kart span { color: var(--soluk); font-size: 12px; letter-spacing: .6px; text-transform: uppercase; font-weight: 600; }
.ozet .kart b { display: block; font-size: 30px; margin-top: 4px; font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
.grafikler { display: grid; grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); gap: 12px; }
@media (max-width: 560px) { .grafikler { grid-template-columns: 1fr; } }
.grafik-bas { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.grafik-bas h2 { margin: 0; }
.grafik-bas .bos + button { padding: 4px 10px; font-size: 12px; }
.grafik { position: relative; }
.grafik svg { display: block; width: 100%; height: 200px; overflow: visible; }
.grafik .ipucu { position: absolute; pointer-events: none; background: var(--panel-d); border: 1px solid var(--kenar); box-shadow: var(--golge);
  border-radius: 8px; padding: 6px 10px; font-size: 13px; white-space: nowrap; transform: translate(-50%, -110%); }
.grafik .ipucu b { font-variant-numeric: tabular-nums; }
.tablo-kap { overflow-x: auto; border: 1px solid var(--kenar); border-radius: 14px; background: var(--panel); box-shadow: var(--golge-k); }
.kart .tablo-kap { box-shadow: none; }
table { border-collapse: collapse; width: 100%; }
.genis table { min-width: 980px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--cizgi); white-space: nowrap; }
th { font-size: 11.5px; color: var(--soluk); letter-spacing: .6px; text-transform: uppercase; font-weight: 600; user-select: none; position: sticky; top: 0; background: var(--panel-d); }
th[data-k] { cursor: pointer; }
th[data-k]:hover { color: var(--text); }
tbody tr { cursor: pointer; transition: background .12s; }
tbody tr:nth-child(even) { background: var(--satir); }
tbody tr:hover { background: color-mix(in srgb, var(--mavi) 9%, transparent); }
tbody tr:last-child td { border-bottom: 0; }
table.duz tbody tr { cursor: default; }
tr.yasakli td:first-child { box-shadow: inset 3px 0 0 var(--kirmizi); }
td.sayi, th.sayi { text-align: right; font-variant-numeric: tabular-nums; }
.no { color: var(--altin); font-variant-numeric: tabular-nums; font-weight: 600; }
.etiket { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.etiket i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.etiket.cevrimici i { background: var(--yesil); box-shadow: 0 0 0 3px color-mix(in srgb, var(--yesil) 22%, transparent); }
.etiket.yasak { color: var(--kirmizi); }
.etiket.yasak i { background: var(--kirmizi); }
.rozet { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--kenar); color: var(--soluk); font-weight: 600; }
.rozet.altin { color: var(--altin); border-color: color-mix(in srgb, var(--altin) 40%, transparent); }
.hile { color: var(--turuncu); }
.arac { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.arac input { max-width: 340px; }
.kimlik { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--soluk); margin-bottom: 14px; }
.kimlik button { padding: 4px 10px; font-size: 12px; }
code { background: var(--panel2); padding: 2px 6px; border-radius: 6px; color: var(--text); font-size: 12px; }
.uyari { border: 1px solid var(--kenar); border-left: 3px solid var(--altin); padding: 10px 14px; background: var(--panel); border-radius: 10px; margin-bottom: 14px; font-size: 14px;
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.uyari.kirmizi { border-left-color: var(--kirmizi); }
.ayarlar { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px; }
@media (max-width: 400px) { .ayarlar { grid-template-columns: 1fr; } }
.ayarlar .kart { display: grid; gap: 12px; align-content: start; }
.satirlar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.anahtar { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text); font-size: 15px; }
.anahtar input { width: auto; }
.gizli { display: none !important; }
.kart.tikla { cursor: pointer; transition: transform .15s, border-color .15s; }
.kart.tikla:hover { border-color: var(--mavi); transform: translateY(-2px); }
.kart.hizli { margin-bottom: 12px; }
dialog { border: 1px solid var(--kenar); border-radius: 16px; background: var(--panel-d); color: var(--text); padding: 0; width: min(640px, calc(100vw - 32px)); box-shadow: var(--golge); }
dialog::backdrop { background: rgba(3, 7, 18, .55); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.diyalog { padding: 22px; display: grid; gap: 14px; }
.diyalog .ust { display: flex; align-items: center; gap: 10px; }
.diyalog .ust h2 { margin: 0; flex: 1; }
dl { display: grid; grid-template-columns: 150px 1fr; gap: 8px 14px; margin: 0; }
@media (max-width: 480px) { dl { grid-template-columns: 1fr; } dd { margin-bottom: 6px; } }
dt { color: var(--soluk); font-size: 13px; }
dd { margin: 0; overflow-wrap: anywhere; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--panel-d); border: 1px solid var(--kenar); box-shadow: var(--golge);
  border-radius: 12px; padding: 10px 16px; font-size: 14px; z-index: 10; }
@media (max-width: 640px) { .ozet { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .ozet .kart { padding: 14px; } .ozet .kart b { font-size: 24px; } #durum { display: none; } .marka span { display: none; } .kap { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="logoRenk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7cf5c"/><stop offset="1" stop-color="#e2730f"/></linearGradient>
  <symbol id="logoSembol" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="url(#logoRenk)"/>
    <path d="M7.5 9h4.4l4.1 10.6L20.1 9h4.4l-6.3 15h-4.4z" fill="#1b1206"/></symbol>
</defs></svg>
<header class="ust-cubuk">
  <div class="kap">
    <div class="marka"><svg class="logo" width="36" height="36"><use href="#logoSembol"/></svg><div><b>VORZEX</b><span>Yönetim Paneli</span></div></div>
    <div class="bos"></div>
    <span id="durum" class="durum"></span>
    <span id="benKim" class="kim gizli"></span>
    <button id="yenile" class="gizli" title="Verileri yenile">↻ Yenile</button>
    <button id="cikis" class="gizli">Çıkış</button>
    <button id="tema" title="Açık / koyu tema" aria-label="Tema">◐</button>
  </div>
</header>
<div class="kap">
  <form id="girisForm" class="kart giris">
    <div class="bas"><svg class="logo" width="56" height="56"><use href="#logoSembol"/></svg><h1>Yönetici girişi</h1><p>VORZEX MOBILE yönetim paneli</p></div>
    <label>Kullanıcı adı<input id="kad" autocomplete="username" required></label>
    <label>Şifre<input id="sifre" type="password" autocomplete="current-password" required></label>
    <button class="ana" type="submit">Giriş yap</button>
    <div id="girisHata" class="not hata"></div>
    <div class="not" style="text-align:center">Hesabın yoksa ana yöneticiden iste: Yöneticiler sekmesinden senin için kullanıcı adı ve şifre oluşturur.</div>
  </form>

  <main id="panel" class="gizli">
    <div class="kimlik">Yönetici kimliğin: <code id="benimId"></code> <button id="kopyala" type="button">Kopyala</button></div>
    <div id="hataKutu" class="uyari kirmizi gizli"></div>
    <div id="durumKutu"></div>
    <nav class="sekmeler" id="sekmeler"></nav>
    <section id="icerik"></section>
  </main>
</div>

<dialog id="detay"><div class="diyalog" id="detayIc"></div></dialog>
<dialog id="yasakDiyalog"><form class="diyalog" id="yasakForm" method="dialog"></form></dialog>

<script>
"use strict";
const PROJE = "afc217db-b47d-479e-b704-e2decc072e1e", ORTAM = "production";
const AUTH = "https://player-auth.services.api.unity.com/v1/authentication/usernamepassword/";
const SAVE = `https://cloud-save.services.api.unity.com/v1/data/projects/${PROJE}/players`;
const ANAHTARLAR = ["oy_ad", "oy_no", "oy_sv", "oy_para", "oy_elmas", "oy_ilk", "oy_son", "oy_yer", "oy_hile", "oy_hile_not", "oy_surum", "oy_gunler", "oy_klan", "oy_sure"];
const CEVRIMICI_SN = 300, GUN_SN = 86400, TR = 3 * 3600; // gün numarası Türkiye saatine göre (oyunla aynı)

// Ana hesap (yönetici ekleyip çıkarır) ve Unity editörü hesabı: oyundaki Yonetim.Yoneticiler ile aynı.
const SAHIP = "4tI2VJEacbPQsD198kYXXh8GaX0y", EDITOR = "rWjBpXWd5BF9SWbJPFZIWPA4SYMR";
const YON_ANAHTAR = ["yon_yasak", "yon_ayar", "yon_kayit"];

let token = null, benId = null, oyuncular = [], yasaklar = {}, ayar = {}, sekme = "ozet", arama = "", baglanti = "hepsi", siralama = { alan: "son", ters: true };
let yoneticiler = {}, benim = { yasak: {}, kayit: [] }, gecmis = [], yetkili = false;
const $ = id => document.getElementById(id);
const simdi = () => Math.floor(Date.now() / 1000);
const gunNo = t => Math.floor((t + TR) / GUN_SN);
const sayi = v => (v || 0).toLocaleString("tr-TR");
const kacis = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const tarih = t => t ? new Date(t * 1000).toLocaleString("tr-TR", { dateStyle: "medium", timeStyle: "short" }) : "-";
function once(t) {
  if (!t) return "-";
  const f = simdi() - t;
  return f < 3600 ? `${Math.max(1, Math.floor(f / 60))} dk önce` : f < GUN_SN ? `${Math.floor(f / 3600)} saat önce` : `${Math.floor(f / GUN_SN)} gün önce`;
}
// Oynama süresi: "12 sa 40 dk".
const oynama = sn => !sn ? "-" : sn < 3600 ? `${Math.max(1, Math.floor(sn / 60))} dk` : `${Math.floor(sn / 3600)} sa ${Math.floor((sn % 3600) / 60)} dk`;
function sure(sn) {
  if (sn <= 0) return "doldu";
  const g = Math.floor(sn / GUN_SN), s = Math.floor((sn % GUN_SN) / 3600), d = Math.floor((sn % 3600) / 60);
  return g ? `${g} gün ${s} saat` : s ? `${s} saat ${d} dk` : `${Math.max(1, d)} dk`;
}
function toast(m) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

// ---- Tema ----
try { const t = localStorage.getItem("vx_tema"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
$("tema").onclick = () => {
  const koyu = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() === "#0b0f17";
  document.documentElement.dataset.theme = koyu ? "light" : "dark";
  try { localStorage.setItem("vx_tema", document.documentElement.dataset.theme); } catch (e) {}
  ciz();
};

// ---- Giriş ----
async function girisYap(yol) {
  $("girisHata").textContent = "";
  let r, j;
  try {
    r = await fetch(AUTH + yol, { method: "POST", headers: { "Content-Type": "application/json", "ProjectId": PROJE, "UnityEnvironment": ORTAM },
      body: JSON.stringify({ username: $("kad").value.trim(), password: $("sifre").value }) });
    j = await r.json().catch(() => ({}));
  } catch (e) { $("girisHata").textContent = "Bağlanılamadı: internetini kontrol et."; return; }
  if (!r.ok) { $("girisHata").textContent = authHata(`${j.detail || ""} ${j.title || ""}`, yol); return; }
  token = j.idToken; benId = j.userId;
  try { sessionStorage.setItem("vx_oturum", JSON.stringify({ token, benId, bitis: Date.now() + (j.expiresIn || 3500) * 1000 })); } catch (e) {}
  paneliAc();
}
function authHata(m, yol) {
  return /provider is not available/i.test(m) ? "Kullanıcı adı/şifre girişi kapalı: Dashboard > Authentication > Identity providers > Username & Password'ü aç."
    : /WRONG_USERNAME_PASSWORD|Invalid username/i.test(m) ? "Kullanıcı adı ya da şifre yanlış."
    : /USERNAME_TAKEN|already/i.test(m) ? "Bu kullanıcı adı alınmış: başka bir ad dene."
    : /Username does not match/i.test(m) ? "Kullanıcı adında izin verilmeyen karakter var (Türkçe harf, boşluk olmasın; İngilizce harf, rakam, . - @ _)."
    : /password/i.test(m) && yol === "sign-up" ? "Şifre uygun değil: 8-30 karakter, büyük harf, küçük harf, rakam ve sembol içermeli."
    : /too many|rate/i.test(m) ? "Çok fazla deneme: birkaç dakika sonra tekrar dene."
    : (yol === "sign-in" ? "Giriş olmadı: " : "Hesap oluşturulamadı: ") + m.trim();
}
// Yeni yönetici hesabı: oturumu değiştirmeden hesap açar (varsa ve şifre doğruysa onu kullanır); kimliğini döner.
async function hesapKimligi(kad, sifre) {
  const dene = async yol => {
    const r = await fetch(AUTH + yol, { method: "POST", headers: { "Content-Type": "application/json", "ProjectId": PROJE, "UnityEnvironment": ORTAM },
      body: JSON.stringify({ username: kad, password: sifre }) });
    return { ok: r.ok, j: await r.json().catch(() => ({})) };
  };
  let s = await dene("sign-up");
  if (s.ok) return s.j.userId;
  const m = `${s.j.detail || ""} ${s.j.title || ""}`;
  if (/USERNAME_TAKEN|already/i.test(m)) {
    const g = await dene("sign-in");
    if (g.ok) return g.j.userId;
    throw new Error("Bu kullanıcı adı alınmış (şifresi farklı): başka bir kullanıcı adı seç.");
  }
  throw new Error(authHata(m, "sign-up"));
}
$("girisForm").onsubmit = e => { e.preventDefault(); girisYap("sign-in"); };
$("cikis").onclick = () => { try { sessionStorage.removeItem("vx_oturum"); } catch (e) {} location.reload(); };
$("kopyala").onclick = () => { navigator.clipboard && navigator.clipboard.writeText(benId); toast("Kimlik kopyalandı."); };
$("yenile").onclick = () => yukle();

function paneliAc() {

const benAd = () => (yoneticiler[benId] && yoneticiler[benId].ad) || "Yönetici";
function kimiCiz() {

// Özet açıkken dakikada bir kendiliğinden yenile (sekme görünürken, pencere açık değilken).
setInterval(() => { if (token && yetkili && sekme === "ozet" && !document.hidden && !document.querySelector("dialog[open]")) yukle(); }, 60000);

// ---- Veri ----
async function istek(url, secenek = {}) {
  const r = await fetch(url, { ...secenek, headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token } });
  if (r.status === 401) { try { sessionStorage.removeItem("vx_oturum"); } catch (e) {} throw new Error("Oturum süresi doldu: sayfayı yenileyip yeniden giriş yap."); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(`${j.detail || j.title || r.statusText || "hata"}`);
  return j;
}

async function yukle() {
  $("durum").textContent = "Yükleniyor...";
  hataGoster("");
  try {
    await yonetimKaydiniOku();
    kimiCiz();
    if (!yetkili) {
      $("durum").textContent = "";
      $("sekmeler").innerHTML = ""; $("icerik").innerHTML = ""; $("durumKutu").innerHTML = "";
      hataGoster("Bu hesap yönetici değil. Ana yöneticinin seni Yöneticiler sekmesinden eklemesi gerekir.");
      return;
    }
    const liste = [];
    for (let sayfa = 0; sayfa < 20; sayfa++) {
      const j = await istek(`${SAVE}/public/query`, { method: "POST", body: JSON.stringify({
        fields: [{ key: "oy_son", value: "0", op: "GT", asc: false }], returnKeys: ANAHTARLAR, offset: sayfa * 100, limit: 100 }) });
      const sonuc = j.results || [];
      for (const e of sonuc) liste.push(ozet(e));
      if (sonuc.length < 100) break;
    }
    oyuncular = liste;
    sekmeleriCiz();

  }
  ciz();
}

function ozet(e) {
  const d = {};
  for (const o of e.data || []) d[o.key] = o.value;
  const n = k => parseInt(d[k], 10) || 0;
  return { id: e.id, ad: d.oy_ad || "(adsız)", no: d.oy_no || "", sv: n("oy_sv"), para: n("oy_para"), elmas: n("oy_elmas"),
    ilk: n("oy_ilk"), son: n("oy_son"), yer: d.oy_yer || "", hile: n("oy_hile"), hileNot: d.oy_hile_not || "",
    surum: n("oy_surum"), klan: d.oy_klan || "", sure: n("oy_sure"), gunler: String(d.oy_gunler || "").split(",").map(x => parseInt(x, 10)).filter(x => x > 0) };
}

// Yasak listesi: yeni biçim JSON nesnesi; eski biçim virgüllü kimlikler (kalıcı sayılır).
function yasakCoz(v) {
  if (!v) return {};
  if (typeof v === "object") return v;
  const s = String(v).trim();
  if (s.startsWith("{")) { try { return JSON.parse(s); } catch (e) { return {}; } }
  const o = {}; for (const id of s.split(",").map(x => x.trim()).filter(Boolean)) o[id] = { b: 0, n: "", z: 0 }; return o;
}
const yasakAktif = y => !!y && !y.s && (!y.b || y.b > simdi());
const yasagi = id => yasakAktif(yasaklar[id]) ? yasaklar[id] : null;
const jsonCoz = v => { if (!v) return null; if (typeof v === "object") return v; try { return JSON.parse(v); } catch (e) { return null; } };

async function kayitlariOku(id, anahtarlar) {
  const j = await istek(`${SAVE}/${id}/public/items?` + anahtarlar.map(k => "keys=" + k).join("&"));
  const d = {}; for (const o of j.results || []) d[o.key] = o.value;
  return d;
}

// Bütün yöneticilerin kayıtlarını okur ve birleştirir: yasakta her oyuncu için en yeni kayıt, ayarda en yeni "z".
async function yonetimKaydiniOku() {
  const sahip = await kayitlariOku(SAHIP, [...YON_ANAHTAR, "yon_yoneticiler"]);
  yoneticiler = { [SAHIP]: { ad: "Ana yönetici" }, [EDITOR]: { ad: "Unity editörü" }, ...(jsonCoz(sahip.yon_yoneticiler) || {}) };
  yetkili = !!yoneticiler[benId];
  const kayitlar = { [SAHIP]: sahip };
  await Promise.all(Object.keys(yoneticiler).filter(id => id !== SAHIP).map(async id => {
    try { kayitlar[id] = await kayitlariOku(id, YON_ANAHTAR); } catch (e) { kayitlar[id] = {}; }
  }));
  const birlesik = {}; let enYeniAyar = null; const g = [];
  for (const [id, d] of Object.entries(kayitlar)) {
    for (const [oid, y] of Object.entries(yasakCoz(d.yon_yasak))) {
      const e = birlesik[oid];
      if (!e || (y.z || 0) > (e.z || 0)) birlesik[oid] = y;
    }
    const a = jsonCoz(d.yon_ayar);
    if (a && (!enYeniAyar || (a.z || 0) > (enYeniAyar.z || 0))) enYeniAyar = a;
    const ad = (yoneticiler[id] && yoneticiler[id].ad) || id;
    for (const k of jsonCoz(d.yon_kayit) || []) g.push({ ...k, kim: ad });
  }
  yasaklar = birlesik;
  ayar = enYeniAyar || {};
  gecmis = g.sort((a, b) => b.z - a.z);
  const kendi = kayitlar[benId] || {};
  benim = { yasak: yasakCoz(kendi.yon_yasak), kayit: jsonCoz(kendi.yon_kayit) || [] };
}
async function yaz(anahtar, deger) {
  await istek(`${SAVE}/${benId}/public/items`, { method: "POST", body: JSON.stringify({ key: anahtar, value: JSON.stringify(deger) }) });
}
// İşlem geçmişine yazar (kendi kaydına, son 200). Yazılamazsa işlemi bozmaz.
async function kayitEkle(metin) {
  if (!metin) return;
  const k = { z: simdi(), t: metin };
  benim.kayit = [...benim.kayit, k].slice(-200);
  gecmis.unshift({ ...k, kim: benAd() });
  try { await yaz("yon_kayit", benim.kayit); } catch (e) { console.warn(e); }
}

// Yasak ya da kaldırma (kayit null): kendi kaydına en yeni kayıt olarak yazılır; başka yöneticinin yasağını da geçersiz kılar.
async function yasakKaydet(id, kayit, not) {
  await yonetimKaydiniOku(); // başka cihazdan değişmiş olabilir
  const yeni = {};
  for (const [k, v] of Object.entries(benim.yasak))
    if (v.s ? simdi() - (v.z || 0) < 30 * GUN_SN : yasakAktif(v)) yeni[k] = v; // süresi dolanlar ve eski kaldırmalar temizlenir
  yeni[id] = kayit ? { ...kayit, z: simdi(), y: benAd() } : { s: 1, z: simdi(), y: benAd() };
  await yaz("yon_yasak", yeni);
  benim.yasak = yeni;
  yasaklar[id] = yeni[id];
  await kayitEkle(not);
}
async function ayarKaydet(degisim, not) {
  await yonetimKaydiniOku();
  ayar = { ...ayar, ...degisim, z: simdi() };
  await yaz("yon_ayar", ayar);
  await kayitEkle(not);
}
async function yoneticiListesiYaz(liste, not) {
  if (benId !== SAHIP) throw new Error("Yönetici ekleyip çıkarmayı yalnız ana yönetici yapabilir.");
  await yaz("yon_yoneticiler", liste);
  await kayitEkle(not);
  await yonetimKaydiniOku();
}

const SEKMELER = [["ozet", "Özet"], ["oyuncular", "Oyuncular"], ["hile", "Hile şüphelileri"], ["yasakli", "Yasaklılar"], ["jeton", "Jeton (Elmas)"],

  tabloCiz(ic, liste, baslik);
}

function ozetCiz(ic) {
  const bugun = gunNo(simdi());
  const cevrimiciler = oyuncular.filter(p => simdi() - p.son < CEVRIMICI_SN).sort((a, b) => b.son - a.son);
  const kartlar = [
    ["Toplam kayıtlı oyuncu", oyuncular.length, null, "oyuncular:hepsi"],
    ["Şu an çevrimiçi", cevrimiciler.length, null, "oyuncular:acik"],
    ["Şu an haritada", cevrimiciler.filter(p => p.yer === "harita").length, null, "oyuncular:acik"],
    ["Bugün oynayan", oyuncular.filter(p => gunNo(p.son) === bugun).length],
    ["Son 7 günde oynayan", oyuncular.filter(p => bugun - gunNo(p.son) < 7).length],
    ["Son 7 günde yeni", oyuncular.filter(p => p.ilk && bugun - gunNo(p.ilk) < 7).length],
    ["Hile şüphelisi", oyuncular.filter(p => p.hile > 0).length, null, "hile:hepsi"],
    ["Yasaklı", oyuncular.filter(p => yasagi(p.id)).length, null, "yasakli:hepsi"],
    ["Toplam oynama", null, oynama(oyuncular.reduce((t, p) => t + p.sure, 0))],
    ["Oyunculardaki para (₺)", oyuncular.reduce((t, p) => t + p.para, 0)],
  ];
  // Son 30 gün: günlük aktif (oyuncuların oynadığı günler) ve yeni oyuncu.
  const gunler = [...Array(30)].map((_, i) => bugun - 29 + i);
  const aktif = gunler.map(g => oyuncular.filter(p => p.gunler.includes(g) || gunNo(p.son) === g).length);
  const yeni = gunler.map(g => oyuncular.filter(p => p.ilk && gunNo(p.ilk) === g).length);
  ic.innerHTML = `<div class="ozet">${kartlar.map(([a, v, m, git]) => `<div class="kart${git ? " tikla" : ""}"${git ? ` data-git="${git}"` : ""}><span>${a}</span><b>${m ?? sayi(v)}</b></div>`).join("")}</div>
    ${hizliIslemler()}
    ${cevrimiciListesi(cevrimiciler)}
    <div class="grafikler">
      ${grafikKarti("aktif", "Günlük aktif oyuncu", "son 30 gün")}
      ${grafikKarti("yeni", "Yeni oyuncu", "son 30 gün")}
    </div>
    <p class="not">Çevrimiçi: son 5 dakikada oyunu açık olanlar. Liste ve grafikler oyunun yönetim kaydı içeren sürümünü en az bir kez açmış oyuncuları kapsar.</p>`;
  ic.querySelectorAll("[data-git]").forEach(k => k.onclick = () => { const [sk, b] = k.dataset.git.split(":"); sekme = sk; baglanti = b; arama = ""; sekmeleriCiz(); ciz(); });
  ic.querySelectorAll("tr[data-id]").forEach(tr => tr.onclick = () => detayAc(tr.dataset.id));
  const bk = $("hizliBakim");
  if (bk) bk.onclick = async () => {
    const acik = !(ayar.bakim && ayar.bakim.acik);
    if (acik && !confirm("Oyun bakıma alınsın mı? Yönetici olmayan herkes (telefondaki kendi oyun hesabın da) 2 dakika içinde lobiye alınır ve oynayamaz.")) return;
    bk.disabled = true;
    try { await ayarKaydet({ bakim: { acik, mesaj: (ayar.bakim && ayar.bakim.mesaj) || "" } }, acik ? "Bakım modu açıldı" : "Bakım modu kapatıldı"); toast(acik ? "Bakım modu açıldı (oyunculara 2 dk içinde ulaşır)." : "Bakım modu kapatıldı."); }
    catch (e) { hataGoster("Kaydedilemedi: " + e.message); }
    ciz();
  };
  const dy = $("hizliDuyuru");
  if (dy) dy.onclick = () => { sekme = "ayar"; sekmeleriCiz(); ciz(); };
  sutunGrafigi($("g_aktif"), gunler, aktif, "oyuncu");
  sutunGrafigi($("g_yeni"), gunler, yeni, "yeni oyuncu");
}
// Özet'te tek dokunuşla: bakım aç/kapat, duyuru yaz.
function hizliIslemler() {

// Şu an çevrimiçi olanlar: ad, numara, nerede, para, oynama; dokununca ayrıntı.
function cevrimiciListesi(liste) {
  const satirlar = liste.slice(0, 50).map(p => `<tr data-id="${p.id}"><td>${kacis(p.ad)}</td><td class="no">${kacis(p.no)}</td>

    : '<div class="not">Şu an kimse çevrimiçi değil (son 5 dakikada oyunu açık olan yok).</div>'}</div>`;

function grafikKarti(id, ad, alt) {
  return `<div class="kart"><div class="grafik-bas"><h2>${ad}</h2><span class="durum">${alt}</span><span class="bos"></span>
    <button type="button" onclick="this.closest('.kart').querySelector('.tablo-gorunum').classList.toggle('gizli')">Tablo</button></div>
    <div class="grafik" id="g_${id}"></div><div class="tablo-gorunum gizli"></div></div>`;
}
const gunAdi = g => new Date(g * GUN_SN * 1000 - TR * 1000 + 12 * 3600 * 1000).toLocaleDateString("tr-TR", { day: "numeric", month: "short" });

// Sütun grafiği: tek seri (gösterge kutusu yok, başlık adlandırır), ince sütunlar, sütun arası 2 px,
// üst köşeler 4 px yuvarlak, sade ızgara; üzerine gelince değer balonu; tablo görünümü ayrıca.
function sutunGrafigi(kap, gunler, degerler, birim) {
  const W = 600, H = 200, sol = 30, alt = 22, ust = 8;
  const enCok = Math.max(1, ...degerler);
  const adim = Math.max(1, Math.ceil(enCok / 4));
  const tepe = adim * Math.ceil(enCok / adim);
  const gw = (W - sol) / gunler.length, bw = Math.max(2, gw - 2);
  const y = v => ust + (H - alt - ust) * (1 - v / tepe);
  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${birim} sayısı, son 30 gün">`;
  for (let v = 0; v <= tepe; v += adim)
    s += `<line x1="${sol}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--cizgi)" stroke-width="1" vector-effect="non-scaling-stroke"/>
          <text x="${sol - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--soluk)">${v}</text>`;
  degerler.forEach((v, i) => {
    const x = sol + i * gw + 1, h = (H - alt - ust) * (v / tepe), yy = H - alt - h;
    if (v > 0) {
      const r = Math.min(4, bw / 2, h);
      s += `<path d="M${x},${H - alt} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${H - alt} Z" fill="var(--grafik)"/>`;
    }
    if (i % 5 === 4 || i === degerler.length - 1) s += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--soluk)">${gunAdi(gunler[i])}</text>`;
    s += `<rect class="isabet" data-i="${i}" x="${sol + i * gw}" y="0" width="${gw}" height="${H - alt}" fill="transparent"/>`;
  });
  s += `</svg><div class="ipucu gizli"></div>`;
  kap.innerHTML = s;
  const ipucu = kap.querySelector(".ipucu");
  kap.querySelectorAll(".isabet").forEach(r => {
    r.onmouseenter = () => {
      const i = +r.dataset.i, kutu = kap.getBoundingClientRect(), rk = r.getBoundingClientRect();
      ipucu.innerHTML = `${gunAdi(gunler[i])} · <b>${sayi(degerler[i])}</b> ${birim}`;
      ipucu.style.left = (rk.left - kutu.left + rk.width / 2) + "px";
      ipucu.style.top = (y(degerler[i]) / H * kutu.height) + "px";
      ipucu.classList.remove("gizli");
    };
    r.onmouseleave = () => ipucu.classList.add("gizli");
  });
  kap.nextElementSibling.innerHTML = `<div class="tablo-kap" style="margin-top:10px;max-height:240px"><table><thead><tr><th>Gün</th><th class="sayi">${birim}</th></tr></thead><tbody>${
    gunler.map((g, i) => `<tr><td>${gunAdi(g)}</td><td class="sayi">${sayi(degerler[i])}</td></tr>`).reverse().join("")}</tbody></table></div>`;
}

function tabloCiz(ic, liste, baslik) {
  const cevrimici = p => simdi() - p.son < CEVRIMICI_SN;
  if (baglanti === "acik") liste = liste.filter(cevrimici); else if (baglanti === "kapali") liste = liste.filter(p => !cevrimici(p));
  const a = arama.trim().toLocaleLowerCase("tr-TR");
  if (a) liste = liste.filter(p => p.ad.toLocaleLowerCase("tr-TR").includes(a) || p.no.includes(a) || p.id.toLowerCase().includes(a) || p.klan.toLocaleLowerCase("tr-TR").includes(a));
  const { alan, ters } = siralama;
  liste = [...liste].sort((x, y) => (typeof x[alan] === "string" ? x[alan].localeCompare(y[alan], "tr") : (x[alan] || 0) - (y[alan] || 0)) * (ters ? -1 : 1));
  const sutunlar = [["ad", "Ad"], ["no", "Numara"], ["klan", "Klan"], ["sv", "Sv", 1], ["para", "₺", 1], ["elmas", "Elmas", 1], ["sure", "Oynama", 1], ["son", "Son görülme"], ["hile", "Hile", 1], ["surum", "Sürüm", 1]];
  ic.innerHTML = `${baslik}<div class="arac"><input id="ara" placeholder="Ad, numara, klan ya da kimlik ara..." value="${kacis(arama)}">
      <span class="satirlar">${[["hepsi", "Hepsi"], ["acik", "Çevrimiçi"], ["kapali", "Çevrimdışı"]].map(([k, ad]) => `<button type="button" data-b="${k}" class="${baglanti === k ? "ana" : ""}">${ad}</button>`).join("")}</span>
      <span class="durum">${sayi(liste.length)} oyuncu · ₺ ${sayi(liste.reduce((t, p) => t + p.para, 0))} · ${oynama(liste.reduce((t, p) => t + p.sure, 0))} oynama</span><span class="bos"></span><button id="csv" type="button">Excel'e indir (CSV)</button></div>
    <div class="tablo-kap genis"><table><thead><tr>${sutunlar.map(([k, ad, s]) => `<th data-k="${k}" class="${s ? "sayi" : ""}">${ad}${alan === k ? (ters ? " ▾" : " ▴") : ""}</th>`).join("")}</tr></thead>
    <tbody>${liste.map(p => {
      const y = yasagi(p.id), c = simdi() - p.son < CEVRIMICI_SN;
      const son = y ? `<span class="etiket yasak"><i></i>yasaklı${y.b ? " · " + sure(y.b - simdi()) : ""}</span>`
        : c ? `<span class="etiket cevrimici"><i></i>${p.yer === "harita" ? "çevrimiçi · haritada" : "çevrimiçi · lobide"}</span>` : once(p.son);
      return `<tr data-id="${p.id}" class="${y ? "yasakli" : ""}"><td>${kacis(p.ad)}</td><td class="no">${kacis(p.no)}</td><td>${kacis(p.klan)}</td><td class="sayi">${p.sv}</td>
        <td class="sayi">${sayi(p.para)}</td><td class="sayi">${sayi(p.elmas)}</td><td class="sayi">${oynama(p.sure)}</td><td>${son}</td><td class="sayi ${p.hile ? "hile" : ""}">${p.hile || ""}</td><td class="sayi">${p.surum || ""}</td></tr>`;
    }).join("")}</tbody></table></div>`;
  const ara = $("ara");
  ara.oninput = () => { arama = ara.value; const pos = ara.selectionStart; ciz(); const yeni = $("ara"); yeni.focus(); yeni.setSelectionRange(pos, pos); };
  ic.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => { const k = th.dataset.k; siralama = { alan: k, ters: siralama.alan === k ? !siralama.ters : true }; ciz(); });
  ic.querySelectorAll("tbody tr").forEach(tr => tr.onclick = () => detayAc(tr.dataset.id));
  $("csv").onclick = () => csvIndir(liste);
  ic.querySelectorAll("button[data-b]").forEach(b => b.onclick = () => { baglanti = b.dataset.b; ciz(); });
}

function csvIndir(liste) {
  const bas = ["Kimlik", "Ad", "Numara", "Klan", "Seviye", "Para", "Elmas", "Oynama (saat)", "İlk giriş", "Son görülme", "Yer", "Hile", "Son şüphe", "Sürüm", "Yasak"];
  const satir = p => { const y = yasagi(p.id); return [p.id, p.ad, p.no, p.klan, p.sv, p.para, p.elmas, (p.sure / 3600).toFixed(1).replace(".", ","), tarih(p.ilk), tarih(p.son), p.yer, p.hile, p.hileNot, p.surum,
    y ? (y.b ? "bitiş " + tarih(y.b) : "kalıcı") + (y.n ? " · " + y.n : "") : ""]; };
  const hucre = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const metin = "﻿" + [bas, ...liste.map(satir)].map(r => r.map(hucre).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([metin], { type: "text/csv;charset=utf-8" }));
  a.download = `vorzex-oyuncular-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function detayAc(id) {
  const p = oyuncular.find(o => o.id === id); if (!p) return;
  const y = yasagi(p.id), son30 = p.gunler.filter(g => gunNo(simdi()) - g < 30).length;
  $("detayIc").innerHTML = `<div class="ust"><h2>${kacis(p.ad)} <span class="no">${kacis(p.no)}</span></h2><button type="button" id="detayKapat">Kapat</button></div>
    ${y ? `<div class="uyari kirmizi">Yasaklı: ${y.b ? sure(y.b - simdi()) + " kaldı (" + tarih(y.b) + ")" : "kalıcı"}${y.n ? " · Neden: " + kacis(y.n) : ""}${y.z ? " · Verildi: " + tarih(y.z) : ""}${y.y ? " · Veren: " + kacis(y.y) : ""}</div>` : ""}
    <dl>
      <dt>Hesap kimliği</dt><dd><code>${kacis(p.id)}</code></dd>
      <dt>Klan</dt><dd>${kacis(p.klan) || "-"}</dd>
      <dt>Seviye</dt><dd>${p.sv}</dd>
      <dt>Para / Elmas</dt><dd>₺ ${sayi(p.para)} · ${sayi(p.elmas)} elmas</dd>
      <dt>Toplam oynama</dt><dd>${oynama(p.sure)}</dd>
      <dt>İlk giriş</dt><dd>${tarih(p.ilk)}</dd>
      <dt>Son görülme</dt><dd>${tarih(p.son)} (${once(p.son)}${simdi() - p.son < CEVRIMICI_SN ? ", " + (p.yer === "harita" ? "haritada" : "lobide") : ""})</dd>
      <dt>Son 30 günde</dt><dd>${son30} gün oynadı</dd>
      <dt>Sürüm</dt><dd>${p.surum || "-"}</dd>
      <dt>Hile şüphesi</dt><dd class="${p.hile ? "hile" : ""}">${p.hile ? `${p.hile} olay · son: ${kacis(p.hileNot)}` : "yok"}</dd>
    </dl>
    <div class="satirlar">${p.id === benId ? "" : y ? `<button type="button" id="yasakKaldir" class="ana">Yasağı kaldır</button>` : `<button type="button" id="yasakla" class="tehlike dolu">Yasakla...</button>`}</div>`;
  $("detayKapat").onclick = () => $("detay").close();
  if ($("yasakKaldir")) $("yasakKaldir").onclick = async () => {
    try { await yasakKaydet(p.id, null, `Yasak kaldırıldı: ${p.ad} (${p.no})`); toast(`${p.ad} yasağı kaldırıldı.`); } catch (e) { hataGoster("Yazılamadı: " + e.message); }
    $("detay").close(); ciz();
  };
  if ($("yasakla")) $("yasakla").onclick = () => { $("detay").close(); yasakDiyalogu(p); };
  $("detay").showModal();
}

function yasakDiyalogu(p) {
  $("yasakForm").innerHTML = `<div class="ust"><h2>Yasakla: ${kacis(p.ad)} <span class="no">${kacis(p.no)}</span></h2></div>
    <label>Süre<select id="ySure"><option value="86400">1 gün</option><option value="259200">3 gün</option><option value="604800" selected>7 gün</option>
      <option value="2592000">30 gün</option><option value="0">Kalıcı</option></select></label>
    <label>Neden (oyuncu görür)<input id="yNeden" maxlength="120" value="${p.hile ? "Hile şüphesi" : ""}" placeholder="ör. Hile, küfür, hata kötüye kullanımı"></label>
    <div class="not">Oyuncu en geç 2 dakika içinde oyundan atılır; süre dolunca kendiliğinden açılır.</div>
    <div class="satirlar"><button value="iptal">Vazgeç</button><button value="tamam" class="tehlike dolu">Yasakla</button></div>`;
  $("yasakDiyalog").onclose = async () => {
    if ($("yasakDiyalog").returnValue !== "tamam") return;
    const sn = +$("ySure").value, neden = $("yNeden").value.trim();
    const sureAdi = $("ySure").selectedOptions[0].textContent;
    try { await yasakKaydet(p.id, { b: sn ? simdi() + sn : 0, n: neden }, `Yasaklandı: ${p.ad} (${p.no}) · ${sureAdi}${neden ? " · " + neden : ""}`); toast(`${p.ad} yasaklandı.`); } catch (e) { hataGoster("Yasak yazılamadı: " + e.message); }
    ciz();
  };
  $("yasakDiyalog").returnValue = "";
  $("yasakDiyalog").showModal();
}

function ayarCiz(ic) {
  const d = ayar.duyuru || {}, b = ayar.bakim || {};
  const duyuruAktif = d.metin && d.bitis > simdi();
  ic.innerHTML = `<div class="ayarlar">
    <form class="kart" id="fDuyuru"><h2>Duyuru</h2>
      <div class="not">Herkesin lobisinde üstte görünür (oyuncu kapatabilir). ${duyuruAktif ? `Yayında: ${sure(d.bitis - simdi())} kaldı.` : "Şu an duyuru yok."}</div>
      <label>Mesaj<textarea id="dMetin" maxlength="200" placeholder="ör. Bu akşam 21:00'de klan etkinliği var!">${kacis(duyuruAktif ? d.metin : "")}</textarea></label>
      <label>Ne kadar yayında kalsın<select id="dSure"><option value="3600">1 saat</option><option value="21600">6 saat</option><option value="86400" selected>1 gün</option><option value="259200">3 gün</option><option value="604800">7 gün</option></select></label>
      <div class="satirlar"><button class="ana" type="submit">Yayınla</button>${duyuruAktif ? `<button type="button" id="dKaldir" class="tehlike">Duyuruyu kaldır</button>` : ""}</div>
    </form>
    <form class="kart" id="fBakim"><h2>Bakım modu</h2>
      <div class="not">Açıkken oyuncular "bakımdayız" ekranı görür, haritadakiler lobiye alınır (en geç 2 dk). Yöneticiler girebilir.</div>
      <label class="anahtar"><input type="checkbox" id="bAcik" ${b.acik ? "checked" : ""}> Bakım modu ${b.acik ? "<b class=\"hata\">AÇIK</b>" : "kapalı"}</label>
      <label>Oyunculara mesaj<input id="bMesaj" maxlength="160" value="${kacis(b.mesaj || "")}" placeholder="ör. Güncelleme yapılıyor, 30 dakika sonra geri döneceğiz."></label>
      <div class="satirlar"><button class="ana" type="submit">Kaydet</button></div>
    </form>
    <form class="kart" id="fSurum"><h2>Zorunlu güncelleme</h2>
      <div class="not">Bu sürüm kodunun altındaki oyuncular "güncelleme gerekli" ekranı görür ve oynayamaz. 0 = kapalı. Oyuncuların sürümleri Oyuncular sekmesinde.</div>
      <label>En düşük sürüm kodu<input id="sKod" type="number" min="0" step="1" value="${ayar.minSurum || 0}"></label>
      <label>Mesaj<input id="sMesaj" maxlength="160" value="${kacis(ayar.surumMesaj || "")}" placeholder="ör. Yeni sürümü indir: ..."></label>
      <div class="satirlar"><button class="ana" type="submit">Kaydet</button></div>
    </form>
  </div>`;
  const kaydet = async (degisim, mesaj, not) => {
    try { await ayarKaydet(degisim, not); toast(mesaj); } catch (e) { hataGoster("Kaydedilemedi: " + e.message); }
    ciz();
  };
  $("fDuyuru").onsubmit = e => { e.preventDefault(); const m = $("dMetin").value.trim(); if (!m) return toast("Mesaj yaz.");
    kaydet({ duyuru: { metin: m, z: simdi(), bitis: simdi() + +$("dSure").value } }, "Duyuru yayınlandı (oyunculara 2 dk içinde ulaşır).",
      `Duyuru yayınlandı (${$("dSure").selectedOptions[0].textContent}): ${m}`); };
  if ($("dKaldir")) $("dKaldir").onclick = () => kaydet({ duyuru: null }, "Duyuru kaldırıldı.", "Duyuru kaldırıldı");
  $("fBakim").onsubmit = e => { e.preventDefault(); const acik = $("bAcik").checked;
    if (acik && !(ayar.bakim && ayar.bakim.acik) && !confirm("Bakım modu açılsın mı? Oyuncular oyuna giremez.")) return;
    kaydet({ bakim: { acik, mesaj: $("bMesaj").value.trim() } }, acik ? "Bakım modu açıldı." : "Bakım modu kapatıldı.", acik ? "Bakım modu açıldı" : "Bakım modu kapatıldı"); };
  $("fSurum").onsubmit = e => { e.preventDefault(); const kod = Math.max(0, parseInt($("sKod").value, 10) || 0);
    kaydet({ minSurum: kod, surumMesaj: $("sMesaj").value.trim() }, "Sürüm ayarı kaydedildi.", `En düşük sürüm: ${kod || "kapalı"}`); };
}

// Yöneticiler: liste herkese görünür; ekleme / çıkarma yalnız ana yöneticide.
function yoneticiCiz(ic) {
  const sahip = benId === SAHIP;
  const sabit = id => id === SAHIP || id === EDITOR;
  const satirlar = Object.entries(yoneticiler).map(([id, y]) => `<tr>
      <td><b>${kacis(y.ad)}</b>${id === benId ? ' <span class="rozet">sen</span>' : ""}${id === SAHIP ? ' <span class="rozet altin">ana</span>' : ""}</td>
      <td>${y.k ? kacis(y.k) : '<span class="durum">-</span>'}</td><td>${y.z ? tarih(y.z) : '<span class="durum">-</span>'}</td>
      <td><code>${kacis(id)}</code></td>
      <td class="sayi">${sahip && !sabit(id) ? `<button type="button" class="tehlike" data-sil="${kacis(id)}">Çıkar</button>` : ""}</td></tr>`).join("");
  ic.innerHTML = `<div class="ayarlar">
    <div class="kart" style="grid-column:1/-1"><h2>Yöneticiler (${Object.keys(yoneticiler).length})</h2>
      <div class="tablo-kap"><table class="duz"><thead><tr><th>Ad</th><th>Kullanıcı adı</th><th>Eklendi</th><th>Kimlik</th><th></th></tr></thead><tbody>${satirlar}</tbody></table></div>
      <div class="not" style="margin-top:10px">Yöneticiler oyuncuları yasaklayabilir, duyuru, bakım ve sürüm ayarlarını değiştirebilir. Her işlem İşlem geçmişi'nde görünür.
        Çıkarılan yöneticinin koyduğu yasaklar da kalkar.</div></div>
    ${sahip ? `<form class="kart" id="fYonetici"><h2>Yönetici ekle</h2>
      <div class="not">Bu kullanıcı adı ve şifreyle panel hesabı açılır; kişi bu sayfadan aynı bilgilerle giriş yapar. Şifreyi ona sen ilet.</div>
      <label>Ad (listede görünür)<input id="yAd" maxlength="30" required placeholder="ör. Mehmet"></label>
      <label>Kullanıcı adı<input id="yKad" required minlength="3" maxlength="20" autocomplete="off" pattern="[A-Za-z0-9.@_-]{3,20}" placeholder="ör. mehmet.vx"></label>
      <label>Şifre<input id="ySifre" required minlength="8" maxlength="30" autocomplete="new-password" placeholder="en az 8 karakter"></label>
      <div class="satirlar"><button type="button" id="ySifreUret">Güçlü şifre üret</button><span class="bos"></span><button class="ana" type="submit">Ekle</button></div>
      <div class="not">Kullanıcı adı: İngilizce harf, rakam, . - @ _ (3-20). Şifre: 8-30 karakter, büyük harf, küçük harf, rakam ve sembol.</div>
    </form>` : `<div class="kart"><h2>Yönetici ekle</h2><div class="not">Yönetici ekleyip çıkarmayı yalnız ana yönetici yapabilir.</div></div>`}
  </div>`;
  if (!sahip) return;
  const ekliler = () => Object.fromEntries(Object.entries(yoneticiler).filter(([id]) => !sabit(id)));
  $("ySifreUret").onclick = () => {
    const h = "ABCDEFGHJKLMNPRSTUVYZ", k = "abcdefghijkmnprstuvyz", r = "23456789", s = "!@#$%*?";
    const sec = t => t[crypto.getRandomValues(new Uint32Array(1))[0] % t.length];
    const p = [sec(h), sec(h), sec(k), sec(k), sec(k), sec(k), sec(r), sec(r), sec(r), sec(s), sec(s), sec(k)];
    for (let i = p.length - 1; i > 0; i--) { const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1); [p[i], p[j]] = [p[j], p[i]]; }
    $("ySifre").value = p.join("");
  };
  $("fYonetici").onsubmit = async e => {
    e.preventDefault();
    const ad = $("yAd").value.trim(), kad = $("yKad").value.trim(), sifre = $("ySifre").value;
    const dugme = e.submitter; if (dugme) dugme.disabled = true;
    try {
      const id = await hesapKimligi(kad, sifre);
      await yonetimKaydiniOku();
      if (yoneticiler[id]) throw new Error("Bu hesap zaten yönetici.");
      await yoneticiListesiYaz({ ...ekliler(), [id]: { ad, k: kad, z: simdi() } }, `Yönetici eklendi: ${ad} (${kad})`);
      toast(`${ad} yönetici yapıldı. Kullanıcı adı ve şifreyi ona ilet.`);
    } catch (err) { hataGoster(err.message); toast("Eklenemedi: " + err.message); }
    ciz();
  };
  ic.querySelectorAll("[data-sil]").forEach(b => b.onclick = async () => {
    const id = b.dataset.sil, y = yoneticiler[id];
    if (!confirm(`${y.ad} yöneticilikten çıkarılsın mı? Panele giremez, koyduğu yasaklar kalkar.`)) return;
    b.disabled = true;
    try {
      await yonetimKaydiniOku();
      const l = ekliler(); delete l[id];
      await yoneticiListesiYaz(l, `Yönetici çıkarıldı: ${y.ad}${y.k ? " (" + y.k + ")" : ""}`);
      toast(`${y.ad} çıkarıldı.`);
    } catch (err) { hataGoster(err.message); }
    ciz();
  });
}

// İşlem geçmişi: bütün yöneticilerin işlemleri, en yeni üstte.
function gecmisCiz(ic) {
  const a = arama.trim().toLocaleLowerCase("tr-TR");
  const liste = (a ? gecmis.filter(k => (k.t + " " + k.kim).toLocaleLowerCase("tr-TR").includes(a)) : gecmis).slice(0, 400);
  ic.innerHTML = `<div class="arac"><input id="ara" placeholder="İşlemlerde ara (ad, yasak, duyuru...)" value="${kacis(arama)}">
      <span class="durum">${sayi(liste.length)} işlem</span></div>
    ${liste.length ? `<div class="tablo-kap"><table class="duz"><thead><tr><th>Zaman</th><th>Yönetici</th><th>İşlem</th></tr></thead><tbody>${
      liste.map(k => `<tr><td>${tarih(k.z)} <span class="durum">· ${once(k.z)}</span></td><td>${kacis(k.kim)}</td><td style="white-space:normal">${kacis(k.t)}</td></tr>`).join("")
    }</tbody></table></div>` : '<div class="kart not">Henüz kayıtlı işlem yok. Yasak, duyuru, bakım, sürüm ve yönetici işlemleri burada listelenir.</div>'}`;
  const ara = $("ara");
  ara.oninput = () => { arama = ara.value; const pos = ara.selectionStart; ciz(); const yeni = $("ara"); yeni.focus(); yeni.setSelectionRange(pos, pos); };
}

// Kayıtlı oturum (sayfa yenilenince yeniden giriş istemesin; en çok 1 saat). Sonda: bütün tanımlar hazır olsun.
try {
  const o = JSON.parse(sessionStorage.getItem("vx_oturum") || "null");
  if (o && o.bitis > Date.now()) { token = o.token; benId = o.benId; paneliAc(); }
} catch (e) { console.error(e); }
